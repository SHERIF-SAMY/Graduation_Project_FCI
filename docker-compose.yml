version: "3.9"

services:
  renthub-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renthub-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_DRIVER=ODBC Driver 17 for SQL Server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
